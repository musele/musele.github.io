baseURL = "https://musele.github.io/"
title = "Musele 的博客"
theme = "PaperMod"

locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true

# 生成 sitemap.xml / robots.txt 等
[services]
  [services.googleAnalytics]
    ID = ""

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  env = "production"
  defaultTheme = "auto"
  DateFormat = "2006-01-02"

  ShowReadingTime = true
  ShowWordCount = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  UseHugoToc = true
  comments = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "你好，我是 Musele 👋"
    Content = """
这里记录我的技术笔记、读书心得和生活随想。

用 [Hugo](https://gohugo.io/) 和 [PaperMod](https://github.com/adityatelange/hugo-PaperMod) 搭建。
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/musele"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.footer]
    text = "[RSS](/index.xml)"

  [params.utterances]
    repo = "musele/musele.github.io"
    issueTerm = "pathname"
    theme = "preferred-color-scheme"

  [params.editPost]
    URL = "https://github.com/musele/musele.github.io/edit/main/content/"
    Text = "编辑此页"
    AppendFilePath = true

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 40

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 50
